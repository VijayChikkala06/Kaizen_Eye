# Small heaps on purpose: this PC has ~15.6 GB RAM (often ~4 GB free) and helpers share it.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.configuration-cache=true
kotlin.code.style=official
# LiteRT 2.2.0 ships `litert` and `litert-api` AARs with the SAME manifest namespace (com.google.ai.edge.litert); AGP 9 rejects
# duplicate namespaces unless this is relaxed. (Found by the B0 resolution audit.)
android.uniquePackageNames=false
